<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | asb photography</title>
  <meta name="description" content="Book a photo shoot with asb photography.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
{{HEADER contact}}
  <main>
    <h1 class="display display-page">Contact</h1>
    <section class="contact-page">
      <p class="inquire-intro">For sessions, events and collaborations, <em>I&rsquo;d love to hear from you.</em></p>
      <!-- Messages are delivered by FormSubmit. Replace the email in the action with hers. -->
      <form class="inquiry" action="https://formsubmit.co/asavagebrooks@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Photo Shoot Inquiry">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="field-row">
          <div class="field">
            <label class="label" for="first-name">First name</label>
            <input id="first-name" name="First Name" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label class="label" for="last-name">Last name</label>
            <input id="last-name" name="Last Name" type="text" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field">
          <label class="label" for="phone">Phone number</label>
          <input id="phone" name="Phone Number" type="tel" autocomplete="tel" inputmode="tel">
        </div>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label class="label" for="message">Message</label>
          <textarea id="message" name="Message" required></textarea>
        </div>
      <div class="form-actions">
        <button class="button" type="submit">Send Inquiry</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="form-note">Your details are only used to reply to you.</p>
      </div>
      </form>
    </section>
  </main>
{{FOOTER}}
  <script src="js/main.js"></script>
</body>
</html>
